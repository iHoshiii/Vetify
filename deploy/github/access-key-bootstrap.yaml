AWSTemplateFormatVersion: '2010-09-09'
Description: IAM access-key deployment permissions for main Vetify; no identity provider
Parameters:
  ArtifactBucket:
    Type: String
  AppSecretArn:
    Type: String
  GitHubUserName:
    Type: String
    Default: github-actions-deployer
Resources:
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vetify-github-cloudformation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MainApplicationResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vetify-backend-*'
              - Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/qnjnr8fwf5*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/l305xof20m*'
              - Effect: Allow
                Action: events:*
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/vetify-backend-*'
              - Effect: Allow
                Action: logs:*
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vetify-backend*'
              - Effect: Allow
                Action: [ iam:GetRole, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies ]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vetify-backend-*'
              - Effect: Allow
                Action: [ iam:GetPolicy, iam:GetPolicyVersion, iam:ListPolicyVersions ]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/vetify-backend-*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vetify-backend-*'
                Condition: { StringEquals: { 'iam:PassedToService': lambda.amazonaws.com } }
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn
              - Effect: Allow
                Action: [ s3:GetObject, s3:GetBucketLocation, s3:ListBucket ]
                Resource: [ !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}', !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/vetify-ci/*' ]
              - Effect: Allow
                Action: s3:*
                Resource: [ !Sub 'arn:${AWS::Partition}:s3:::vetify-main-web-${AWS::AccountId}-${AWS::Region}', !Sub 'arn:${AWS::Partition}:s3:::vetify-main-web-${AWS::AccountId}-${AWS::Region}/*' ]
              - Effect: Allow
                Action: [ cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:ListTagsForResource, cloudfront:TagResource, cloudfront:UntagResource ]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/E3UQC3URTVYDHE'
              - Effect: Allow
                Action: [ cloudfront:GetOriginAccessControl, cloudfront:UpdateOriginAccessControl ]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*'
              - Effect: Allow
                Action: [ cloudfront:DescribeFunction, cloudfront:GetFunction, cloudfront:UpdateFunction, cloudfront:PublishFunction ]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/vetify-frontend-spa'
              - Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Sub 'arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*'
  GitHubAccessKeyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: VetifyGitHubDeployment
      Users:
        - !Ref GitHubUserName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vetify/monthly-budget-stop'
          - Effect: Allow
            Action: [ cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet, cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStackResources ]
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vetify-backend/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vetify-frontend/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationRole.Arn
            Condition: { StringEquals: { 'iam:PassedToService': cloudformation.amazonaws.com } }
          - Effect: Allow
            Action: [ cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary ]
            Resource: '*'
          - Effect: Allow
            Action: [ s3:ListBucket, s3:GetBucketLocation ]
            Resource: [ !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}', !Sub 'arn:${AWS::Partition}:s3:::vetify-main-web-${AWS::AccountId}-${AWS::Region}' ]
          - Effect: Allow
            Action: [ s3:GetObject, s3:PutObject ]
            Resource: [ !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/vetify-ci/*', !Sub 'arn:${AWS::Partition}:s3:::vetify-main-web-${AWS::AccountId}-${AWS::Region}/*' ]
          - Effect: Allow
            Action: [ cloudfront:CreateInvalidation, cloudfront:GetInvalidation ]
            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/E3UQC3URTVYDHE'
Outputs:
  CloudFormationRoleArn:
    Value: !GetAtt CloudFormationRole.Arn
