AWSTemplateFormatVersion: '2010-09-09'
Description: Main Vetify private website bucket and CloudFront with API proxy
Parameters:
  ApiHostname:
    Type: String
    AllowedPattern: '[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com'
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+'
  DomainName:
    Type: String
    Default: vetify.page
  UseCustomDomain:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
Conditions:
  CustomDomainEnabled: !Equals [!Ref UseCustomDomain, 'true']
Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'vetify-main-web-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  WebsiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRoutes:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa'
      AutoPublish: true
      FunctionConfig: { Comment: Main Vetify React routes, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('/api/') !== 0 && request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }
  WebsiteHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-website-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "frame-ancestors 'self' https://anatomy.vetify.page"
            Override: true
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Main Vetify website and HTTP API
        DefaultRootObject: index.html
        Aliases: !If [CustomDomainEnabled, [!Ref DomainName], !Ref 'AWS::NoValue']
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        ViewerCertificate: !If
          - CustomDomainEnabled
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebsiteAccess
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Ref ApiHostname
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref WebsiteHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutes.FunctionARN
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
  WebsitePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt WebsiteBucket.Arn, !Sub '${WebsiteBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
Outputs:
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionHostname:
    Value: !GetAtt Distribution.DomainName
  WebsiteUrl:
    Value:
      !If [
        CustomDomainEnabled,
        !Sub 'https://${DomainName}',
        !Sub 'https://${Distribution.DomainName}',
      ]
