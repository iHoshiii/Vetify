services:
  mongo:
    image: mongo:7
    container_name: vetify-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status(); } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); } if (!db.hello().isWritablePrimary) quit(1);"
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
