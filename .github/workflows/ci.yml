name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GEMINI_API_KEY: ci-placeholder-key
  JWT_SECRET_ACCESS: ci-only-access-secret-at-least-32-characters
  MAIL_TRANSPORT: log
  AUTH_MAIL_TRANSPORT: log
  MONGODB_URI: mongodb://127.0.0.1:27017/vetify_tests

jobs:
  checks:
    name: Lint, types, tests and production startup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Check code
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Build app
        run: npm run build
      - name: Run client and server tests
        run: npm run test
      - name: Check standalone production startup
        run: npm run test:production

  e2e-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Save browser results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  aws-artifacts:
    name: Validate and package main AWS application
    needs: [checks, e2e-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      - run: npm run build:lambda
      - run: npm run test:lambda
      - run: node --test scripts/__tests__/serverless-template.test.mjs scripts/__tests__/github-deployment.test.mjs
      - run: sam validate --lint --template-file deploy/serverless/template.yaml --region ap-southeast-2
      - run: sam validate --lint --template-file deploy/frontend/template.yaml --region ap-southeast-2
      - run: sam validate --lint --template-file deploy/github/bootstrap.yaml --region ap-southeast-2
      - run: npm run build:client:prod -- --env-file=deploy/github/frontend-build.env
      - name: Assemble the tested release
        run: |
          mkdir -p release/dist release/deploy
          cp -R dist/client dist/lambda release/dist/
          cp -R deploy/serverless deploy/frontend deploy/github release/deploy/
          git rev-parse HEAD > release/revision.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy main Vetify to AWS
    needs: [checks, e2e-tests, aws-artifacts]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws.yml
