name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GEMINI_API_KEY: ci-placeholder-key
  JWT_SECRET_ACCESS: ci-only-access-secret-at-least-32-characters
  MAIL_TRANSPORT: log
  MONGODB_URI: mongodb://127.0.0.1:27017/vetify_tests

jobs:
  checks:
    name: Lint, types, tests and production startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Check code
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Build app
        run: npm run build
      - name: Run client and server tests
        run: npm run test
      - name: Check production startup and PDF worker
        run: npm run test:production

  e2e-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Save browser results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
