name: Deploy AWS

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vetify-aws-production
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      AWS_CFN_ROLE_ARN: ${{ vars.AWS_CFN_ROLE_ARN }}
      SAM_CLI_TELEMETRY: '0'
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the AWS_DEPLOY_ROLE_ARN repository variable}"
          : "${AWS_CFN_ROLE_ARN:?Set the AWS_CFN_ROLE_ARN repository variable}"
          : "${AWS_ARTIFACT_BUCKET:?Set the AWS_ARTIFACT_BUCKET repository variable}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-release
          path: release
      - name: Check the tested revision
        run: test "$(cat release/revision.txt)" = "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: VetifyGitHubDeploy
          aws-region: ap-southeast-2
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      - name: Update backend, frontend infrastructure and website
        run: bash scripts/deploy-aws.sh
      - name: Check deployed website and database health
        run: node scripts/verify-aws-deployment.mjs
